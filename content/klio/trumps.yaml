# Trümpfe. `id` ist fest und ändert sich nie, auch wenn der Name korrigiert wird.
# Stand: Klio_Trümpfe_Liste_2.1.docx des Autors (2026-11-14), wortgetreu bis auf vier Grammatikfehler (Wahrer Held, Leben
# am Limit, Eine Frage der Logik, Momentum). Ursprünglich aus „Kartentisch (3).html“ übernommen (scripts/extract-legacy.mjs).

- id: schnelle-reflexe
  category: K
  attributes: [ K ]
  level: 1
  name: Schnelle Reflexe
  text: Du hast Vorteil auf alle Körper-Reaktionen.
- id: hinter-mich
  category: K
  attributes: [ K ]
  level: 1
  name: Hinter mich
  text: Wenn ein naher Verbündeter eine Schadenskarte ziehen würde, darfst du sie stattdessen ziehen. Erhalte eine Forschungsnotiz.
- id: standhaft
  category: K
  attributes: [ K ]
  level: 1
  name: Standhaft
  text: Bevor du eine Schadenskarte ziehst, darfst du ihr Symbol erraten. Behältst du recht, legst du sie und ♣ auf die Ablage. Ansonsten nimmst du die Schadenskarte.
- id: risikobewusst
  category: K
  attributes: [ K ]
  level: 1
  name: Risikobewusst
  text: Erhalte Nachteil auf eine Aktion, um vor dem Ziehen ihren Schwierigkeitsgrad zu erfahren.
- id: stoiker
  category: K
  attributes: [ K ]
  level: 2
  name: Stoiker
  text: Während einer Rast kannst du Forschungsnotizen statt Rastpunkte für Rastaktionen ausgeben.
- id: packesel
  category: K
  attributes: [ K ]
  level: 2
  name: Packesel
  text: Während einer Rast, darfst du Rüstzeug aus deinem Inventar entfernen und freigewordenen Platz im Lauf der Expedition neu belegen.
- id: fisch-im-wasser
  category: K
  attributes: [ K ]
  level: 2
  name: Fisch im Wasser
  text: Wähle permanent eine natürliche oder anthropogene Umgebung. Du hast Vorteil auf alle Aktionen zur Fortbewegung in dieser Umgebung.
- id: momentum
  category: K
  attributes: [ K ]
  level: 2
  name: Momentum
  text: Hast du bei einer Aktion drei oder mehr Karten mit demselben Symbol gezogen, darfst du ♣ auf die Ablage legen, um eine weitere Karte zu ziehen.
- id: nur-ueber-meine-leiche
  category: K
  attributes: [ K ]
  level: 3
  name: Nur über meine Leiche
  text: Verhindere, dass das Rampenlicht zu der Welt und ihren Konsequenzen springt. Ziehe eine Symbolprobe. Zeigt sie schwarz, ziehst du eine Schadenskarte.
- id: wahrer-held
  category: K
  attributes: [ K ]
  level: 3
  name: Wahrer Held
  text: Einmal je Expedition, darfst du eine nahezu übermenschliche, körperliche Tat beschreiben. Die Aktion ist automatisch erfolgreich.
- id: leben-am-limit
  category: K
  attributes: [ K ]
  level: 3
  name: Leben am Limit
  text: Du sammelst jedes gezogene ♣, statt es auf die Ablage zu legen oder aus dem Deck zu entfernen. Wenn eine deiner Aktionen scheitern würde, musst du eine dieser Karten als zuletzt gezogene Karte wählen.
- id: luegendetektor
  category: P
  attributes: [ P ]
  level: 1
  name: Lügendetektor
  text: Du hast Vorteil auf Aktionen, mit denen du andere Personen durchschauen und Lügen erkennen willst.
- id: ich-kenne-da-jemanden
  category: P
  attributes: [ P ]
  level: 1
  name: Ich kenne da jemanden
  text: Einmal je Expedition darfst du eine Kontaktperson in der Umgebung benennen, die euch helfen kann. Wer ist sie und woher kennst du sie?
- id: alarmiert
  category: P
  attributes: [ P ]
  level: 1
  name: Alarmiert
  text: Du hast Vorteil auf Aktionen, mit denen du herausfinden willst, ob etwas in der Umgebung unerkannt bleiben möchte. Zusätzlich darfst du während einer Rast Wache halten, ohne Rastpunkte für diese Aktion auszugeben.
- id: punktlandung
  category: P
  attributes: [ P ]
  level: 1
  name: Punktlandung
  text: Erhalte eine Forschungsnotiz, wenn du bei einer Aktion ihren Schwierigkeitsgrad genau triffst.
- id: sprache-der-tiere
  category: P
  attributes: [ P ]
  level: 2
  name: Sprache der Tiere
  text: Du hast Vorteil auf alle Aktionen, mit denen du das Verhalten eines Tieres verstehen oder beeinflussen willst.
- id: januskopf
  category: P
  attributes: [ P ]
  level: 2
  name: Januskopf
  text: Ziehe eine Symbolprobe. Bei Schwarz hast du für die Szene Vorteil auf Aktionen, die bedrohlich wirken und Nachteil auf Aktionen, die wohlwollend wirken. Bei Rot gilt das Gegenteil. Wie zeigen sich deine hellen und dunklen Seiten?
- id: huh
  category: P
  attributes: [ P ]
  level: 2
  name: Huh?
  text: Du kannst jemanden unerkannt dazu bringen, eine unscheinbare, gedankenverlorene Handlung zu unterlassen, etwa einen Namen oder Schlüssel zu vergessen. Lege dafür ♣ auf die Ablage.
- id: teamspieler
  category: P
  attributes: [ P ]
  level: 2
  name: Teamspieler
  text: Aktiviere helfend deine Forschungsnotizen für ein Teammitglied, nachdem die letzte Karte bereits gezogen worden ist. Ziehe dafür eine Schadenskarte.
- id: erbstueck
  category: P
  attributes: [ P ]
  level: 3
  name: Erbstück
  text: "Du trägst ein Artefakt bei dir. Entscheide dich permanent für eine der folgenden Fähigkeiten: Beeinflusse ein Element, manipuliere Gedanken, erschaffe Reichtum. Woher hast du das Artefakt und welchen Preis verlangt es dir ab?"
- id: goldene-vergangenheit
  category: P
  attributes: [ P ]
  level: 3
  name: Goldene Vergangenheit
  text: Benenne eine Stärke, die du die restliche Expedition nutzen kannst. Was bringt dein vergessenes Talent zum Vorschein?
- id: kampfgeister-wecken
  category: P
  attributes: [ P ]
  level: 3
  name: Kampfgeister wecken
  text: "Je Expedition darfst du jeden dieser Boni einmal für dich oder andere einsetzen: Vorteil gewähren, ♠ oder ♣ als ♥ werten oder eine Schadenskarte heilen. Wie motivierst du deine Teammitglieder?"
- id: anatomie
  category: V
  attributes: [ V ]
  level: 1
  name: Anatomie
  text: Beim Ziehen von Schadenskarten darfst du deine oberste Schadenskarte um eins unterschreiten.
- id: feldforschung
  category: V
  attributes: [ V ]
  level: 1
  name: Feldforschung
  text: Erfahre den Schwierigkeitsgrad einer Aktion. Gib dafür eine Forschungsnotiz aus. Wie hilft dir ein früheres Abenteuer bei diesem?
- id: kuehler-kopf
  category: V
  attributes: [ V ]
  level: 1
  name: Kühler Kopf
  text: Ziehst du in einer gefährlichen Situation ♣ als letzte Karte, erhältst du eine zusätzliche Forschungsnotiz.
- id: bastler
  category: V
  attributes: [ V ]
  level: 1
  name: Bastler
  text: Während einer Rast darfst du ein Rüstzeug herstellen, ohne Rastpunkte für diese Aktion auszugeben. Es erhöht das Kartenbudget einer Aktion einmalig um drei und wird dann untauglich.
- id: verbotenes-wissen
  category: V
  attributes: [ V ]
  level: 2
  name: Verbotenes Wissen
  text: Findest du eine kryptische Sprache, darfst du eine Symbolprobe ziehen. Bei Rot verstehst du sie und erfährst den Schwierigkeitsgrad der nächsten Aktion. Bei Schwarz verstehst du sie nicht und legst ♣ auf die Ablage.
- id: ass-im-aermel
  category: V
  attributes: [ V ]
  level: 2
  name: Ass im Ärmel
  text: Ziehst du bei einer Aktion ein Ass, darfst du eine Schadenskarte ziehen, um es offen zu deinen Forschungsnotizen zu legen, statt es für die aktuelle Aktion zu verwenden. Die Karte zählt dann nicht zu deinem Kartenbudget.
- id: chirurgie
  category: V
  attributes: [ V ]
  level: 2
  name: Chirurgie
  text: Heile außerhalb einer Rast eine Schadenskarte, indem du eine Forschungsnotiz ausgibst. Jeder Einsatz erhöht die Kosten um eins. In einer gefährlichen Situation legst du zusätzlich ♣ auf die Ablage.
- id: vertrauter-ort
  category: V
  attributes: [ V ]
  level: 2
  name: Vertrauter Ort
  text: Wähle permanent eine natürliche oder anthropogene Umgebung. Du hast Vorteil auf alle Aktionen zur Orientierung in dieser Umgebung.
- id: schreib-das-auf
  category: V
  attributes: [ V ]
  level: 3
  name: Schreib das auf!
  text: Du darfst eine von dir zuletzt gezogene Karte sammeln. Wenn du dies wiederholst, muss die neue Karte einen benachbarten Wert haben. Hast du drei aufeinanderfolgende Zahlen, kannst du eine der Karten ausgeben, um ihren Wert oder ihr Symbol statt des Wertes oder des Symbols einer zuletzt gezogenen Karte zu verwenden.
- id: prognose
  category: V
  attributes: [ V ]
  level: 3
  name: Prognose
  text: Einmal je Expedition darfst du die nächsten sechs Karten des Decks ansehen, ein ♣ hinzufügen und dann mischen.
- id: eine-frage-der-logik
  category: V
  attributes: [ V ]
  level: 3
  name: Eine Frage der Logik
  text: Einmal je Expedition darfst du für ein unerklärliches Rätsel eine Hypothese äußern, wie alles zusammenhängt, indem du drei eigene Fragen beantwortest (z.B. Wer? Wann? Wo?). Ziehe dann drei Karten. Für jedes ♥ ist ein Element deiner Hypothese korrekt. Welches?
- id: ritualmesser
  category: X
  attributes: [ K, P ]
  level: 1
  name: Ritualmesser
  text: Du besitzt ein verfluchtes Ritualmesser. Erhöhe bei passenden Aktionen dein Kartenbudget um drei. Verursachst du dabei keinen Schaden, ziehst du selbst eine Schadenskarte.
- id: geschaerfte-sinne
  category: X
  attributes: [ P, V ]
  level: 1
  name: Geschärfte Sinne
  text: Einmal je Expedition schärfst du deine Sinne. Für den Rest der Szene hast du Vorteil auf passende Aktionen und Impulse.
- id: denkzettel
  category: X
  attributes: [ V, K ]
  level: 1
  name: Denkzettel
  text: Ziehst du eine 2 oder ein Ass als Schadenskarte, darfst du sie stattdessen zu deinen Forschungsnotizen legen.
- id: stresstest
  category: X
  attributes: [ K, V, P ]
  level: 1
  name: Stresstest
  text: Ziehst du eine Aktion mit ♥, darfst du stattdessen ein ♣ auf die Ablage ziehen und als letzte Karte werten.
- id: imposant
  category: X
  attributes: [ K, P ]
  level: 2
  name: Imposant
  text: Willst du jemanden einschüchtern, beruhigen oder beeinflussen, darfst du ♣ auf die Ablage legen, um das Kartenbudget um dein Körper-Attribut zu erhöhen.
- id: zusammenflicken
  category: X
  attributes: [ V, P ]
  level: 2
  name: Zusammenflicken
  text: Du darfst auch außerhalb einer Rast Schadenskarten heilen. Lege dafür je geheilter Schadenskarte zwei ♣ auf die Ablage.
- id: nie-wieder
  category: X
  attributes: [ V, K ]
  level: 2
  name: Nie wieder
  text: Nach dem Scheitern einer Aktion darfst du eine Narbe markieren und beschreiben, wie daraus ein besonderer Erfolg wird. Wie hast du diese Narbe erhalten?
- id: kraftakt
  category: X
  attributes: [ K, V, P ]
  level: 2
  name: Kraftakt
  text: Erschöpfe eine Stärke, um das Kartenbudget einer Aktion um drei statt um eins zu erhöhen. Du kannst dies auch während der Aktion tun. Die Stärke bleibt für den Rest der Expedition untauglich.
- id: glueck-im-unglueck
  category: X
  attributes: [ K, P ]
  level: 3
  name: Glück im Unglück
  text: Alle Karten mit Wert 2 gelten für dich als ♥, auch bei Impulsen und Schadenskarten. Außerdem gilt das ♣ Ass für dich als ♥ Ass.
- id: sprechende-tote
  category: X
  attributes: [ P, V ]
  level: 3
  name: Sprechende Tote
  text: Einmal je Expedition darfst du drei Ja/Nein-Fragen an ein totes Wesen richten, indem du drei Karten vom Deck ziehst. Für jedes ♥ wird dir eine Frage ehrlich beantwortet, bei ♠ bleiben Antworten rätselhaft. Bei ♣ erzürnst du die Toten. Woher rührt deine Gabe?
- id: historischer-positivismus
  category: X
  attributes: [ V, K ]
  level: 3
  name: Historischer Positivismus
  text: Wenn du einen Misserfolg mit ♠ ziehst, erhältst du zwei (statt eine) Forschungsnotizen.

# Rechte je Rolle (ARCHITEKTUR.md 9.2). Fehlender Schlüssel = deny.
# Werte: allow, deny, own (eigener Bogen und eigene Zonen). Die SL kann zur Laufzeit ändern.

gm: all

player:
  cards.move: allow
  card.flip: allow          # card.flip, zone.flip
  zone.shuffle: allow
  zone.draw: allow
  sheet.edit: own           # sheet.setText, sheet.toggle, sheet.setNumber
  sheet.photo: own
  sheet.roll: own
  trump.choose: own         # trump.choose, trump.random
  trump.chooseFree: deny    # SL kann freigeben (ehem. O9)
  trump.remove: own
  character.revive: deny
  table.reset: deny
  table.setPlayers: deny
  table.setSeat: deny       # Plätze vergibt der Host beim Beitritt, freigeben nur die SL
  seat.edit: own            # eigener Name und eigene Farbe (5e)
  table.setSettings: deny
  gm.expedition: deny
  gm.oracle: deny

spectator: none

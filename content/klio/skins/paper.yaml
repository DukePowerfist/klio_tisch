# Erlebnislaterne als Füllstand (5zm, ARCHITEKTUR.md 10.18): deckt alle Kästchen der Liste `field` ab.
# segments: Glasabschnitte zwischen den gezeichneten Strichen, unten zuerst (gemessen am Bogenbild, in beiden gleich).
# hit: Klickfläche über die ganze Zeichnung. flame: Fuß auf dem Brenner, Neigung wie die Laterne, je Stand [Breite, Höhe]
# (Spitze bei 1 am unteren Strich, bei 2 am oberen, bei 3 knapp unter der Kappe).
# steps: Knöpfe zum Füllen und Leeren rechts daneben (Mitte zwischen beiden, Größe eines Knopfs).
# glow: Schein um die volle Laterne (Mitte des Glases, Radius).
# improve: Mitte der Marke „Stärke verbessern“ unter der Laterne (nur bei vollem Bogen und offenem Anlass, 5zu).

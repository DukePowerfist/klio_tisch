  lower: "Verringern um 1:"
  raise: "Erhöhen um 1 (der Trumpf muss dieses Attribut benötigen):"
  why:
    duplicate: Schon gewählt.
    highest: "Muss zum höchsten Attribut ({attrs}) passen."
    needs: "Muss {attr} benötigen."

trumpDialog:
  title: "Trumpf wählen · Bogen {seat}"
  steps:                                  # Überschrift je Schritt aus trump-sources.yaml
    chooseWeaknessToRemove: Welche Schwäche entfällt?
    improveStrength: Welche Stärke verbessern?
    moveAttributePoint: Attributspunkt umverteilen
  count: "Trümpfe: {n} von {max}"
  random: Zufälliger Trumpf
  free: Freie Wahl
  back: "← Zurück"
  next: Weiter
  close: "✕"
  chooseAttribute: Für welches Attribut?
  selectable: "({n} wählbar)"
  chooseFromCategory: "{category} · Trumpf wählen"
  empty: (leer)
  improveHint: Eine der fünf Stärken darf besser werden. Das Kästchen daneben wird markiert.
  alreadyImproved: bereits verbessert
  skipImprove: Ohne Verbesserung weiter
  newWording: Neue Formulierung

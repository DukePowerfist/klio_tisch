# Beschreibung je Recht (Schritt 5f); „nur eigener Bogen“ wird nur erklärt, wo es nicht selbstverständlich ist
permissionHelp:
  cards.move: Karten zwischen Stapeln, Bögen und Tisch verschieben. Bei „nur eigener Bogen“ nichts auf fremde Bögen legen und nichts von dort nehmen; Deck, Ablage, Auslage, die Stapel in der Tischmitte und der freie Tisch bleiben erlaubt.
  card.flip: Einzelne Karten und ganze Stapel umdrehen. Bei „nur eigener Bogen“ nicht auf fremden Bögen.
  zone.shuffle: Einen Stapel mischen. Bei „nur eigener Bogen“ nicht auf fremden Bögen.
  zone.draw: Karten von einem Stapel ziehen. Bei „nur eigener Bogen“ nicht von fremden Bögen.
  sheet.edit: Einträge, Häkchen und Zahlen auf dem Bogen ändern.
  sheet.photo: Ein Foto für den Charakter setzen oder entfernen.
  sheet.roll: Stärken und Schwächen per Zufallstabelle füllen.
  trump.choose: Einen Trumpf über die Wege des Regelwerks wählen, mit Regelprüfung; auch zufällig.
  trump.chooseFree: Einen beliebigen Trumpf eintragen, ohne Regelprüfung.
  trump.remove: Einen Trumpf vom Bogen nehmen.
  character.revive: Einen toten Charakter wieder ins Spiel holen.
  table.reset: Alle Karten zurück auf ihre Startplätze und neu mischen, auf Wunsch auch die Charaktere. Vorher wird gesichert.
  table.setPlayers: Die Zahl der Plätze am Tisch ändern.
  table.setSeat: Personen auf Plätze setzen und Plätze freigeben.
  table.setSettings: Diese Einstellungen ändern. Wer das darf, kann sich auch selbst weitere Rechte geben.
  gm.expedition: Ein Ergebnis aus der Expeditionstabelle ziehen.
  gm.oracle: Zwei Begriffe aus dem Orakel ziehen.


  noAttributeToLower: Kein Attribut kann verringert werden.
  noTrumpLeft: Es ist kein passender Trumpf übrig.
  maxTrumps: "Es sind höchstens {max} Trümpfe möglich."

sheet:
  roll: Auswürfeln
  rollTitle: Stärken und Schwächen per Zufallstabelle füllen
  rollConfirm: Überschreiben?
  revive: Wiederbeleben
  strike: Untauglich markieren (durchstreichen)

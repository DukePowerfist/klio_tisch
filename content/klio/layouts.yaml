# Ansichten: Tischgröße, Form der Tischzonen, Tischmitte, Lage in Draufsicht und Rollenansicht.
# Ursprünglich aus „Kartentisch (3).html“ (scripts/extract-legacy.mjs); seit Schritt 5d eine gemeinsame Tischmitte
# (ARCHITEKTUR.md 10): beide Ansichten zeigen sie gleich und verschieben sie nur.

board: [ 1760, 990 ]
# wählbare Farben der Plätze (Schritt 5e; Werte in theme.css als --who-c-<Kennung>, Namen in texts.colors);
# die ersten vier sind die Voreinstellung von Platz 1–4. Keine davon wie Gold (Bedienhinweis), Weiß (SL) oder Grau (Zuschauer).
seatColors: [ coral, sky, green, violet, teal, pink, indigo, raspberry ]
card: [ 80, 112 ]
freeCardScale: 0.6
# shapes: Größe, Kartenmaßstab, Fächerabstand; menu = bevorzugte Seite des Stapelmenüs (left/right, ohne Angabe right;
# so gesetzt, wie sie im Normalfall herauskommt, ARCHITEKTUR.md 10.2); label = Beschriftung (center, rotated, x = Anteil)
shapes:
  deck: { w: 80, h: 112, menu: left, label: { center: true } }
  discard: { w: 80, h: 112, label: { center: true } }
  display: { w: 80, h: 112, label: { center: true } }
  diamonds_easy: { w: 48, h: 68, scale: 0.6, growOnOpen: true, menu: left, label: { center: true } }
  diamonds_medium: { w: 48, h: 68, scale: 0.6, growOnOpen: true, menu: right, label: { center: true } }
  diamonds_hard: { w: 48, h: 68, scale: 0.6, growOnOpen: true, menu: right, label: { center: true } }
  clubs: { w: 48, h: 68, scale: 0.6, growOnOpen: true, menu: right, label: { center: true } }
  danger: { w: 400, h: 70, scale: 0.6, fanX: 26 }
  progress: { w: 400, h: 70, scale: 0.6, fanX: 26 }
  seat.damage: { scale: 1, label: { rotated: true, x: 0.22 } }
  seat.notes: { scale: 1, fanX: 40 }
  seat.collect: { scale: 0.4, fanY: 12, label: { rotated: true } }
# Tischmitte: Größe; darin alles relativ zu ihrer linken oberen Ecke. Sie ist zugleich der Spielbereich (Filz,
# Anker frei liegender Karten). gmControlsInset = Abstand der SL-Leiste zum Filzrand: links mindestens (x), unten (y);
# rechts reicht sie seit 5s bis an den Filzrand, ihre Lasche liegt im Spalt daneben (ARCHITEKTUR.md 10.5).
middle:
  size: [ 700, 970 ]
  zones:
    diamonds_easy: [ 104, 104 ]
    diamonds_medium: [ 326, 104 ]
    diamonds_hard: [ 548, 104 ]
    display: [ 310, 292 ]
    deck: [ 208, 484 ]
    discard: [ 412, 484 ]
    danger: [ 72, 654 ]
    progress: [ 72, 766 ]
    clubs: [ 552, 654 ]
  resistTitle: [ 72, 626 ]
  gmControlsInset: [ 40, 26 ]
  # Expeditionsblatt (Schritt 5zb, ARCHITEKTUR.md 10.12): Bild public/assets/sheet/expedition.webp in TP (Pixel / 4).
  # x = linke Bildkante relativ zur Tischmitte; rest = so viel vom Bild liegt über der unteren Brettkante (der gemalte
  # Kopf), der Rest hängt darüber und schneidet der Bildschirmrand ab; lift = Hochrücken beim Überfahren und bei einem
  # Wurf; tilt = Neigung in Grad; read = Höhe der Leselage als Anteil der Fensterhöhe.
  # Im Bild: paper = Papier (x, y, w, h), rows = Kopflinie und Unterkanten der Abschnitte I bis IV, text = Textfläche
  # rechts der römischen Ziffern (von x, bis x).
  expedition: { x: 22, size: [ 320, 450 ], rest: 75, lift: 20, tilt: -2, read: 0.85,
    paper: [ 8.5, 17.75, 304.5, 423.25 ], rows: [ 71.5, 160, 255, 345, 441 ], text: [ 46, 300 ] }
  # Kartenschachtel (5zb): Bild public/assets/cards/oracle-box.webp in TP, Karten public/assets/cards/oracle.webp.
  # cx = Mitte relativ zur Tischmitte (unter Kreuz); rest = sichtbar ab der Oberkante der hinteren Karte bis zur Brettkante,
  # mal Maßstab; out = so weit ragen hintere und vordere Karte über die Öffnung; opening = Öffnungskante im Bild (y);
  # notch = Daumenkerbe (von x, bis x, Tiefe); band = Wortband auf der Karte (x, y, w, h); word = Schrift der Wörter;
  # maxScale = größter Maßstab auf kleinen Bildschirmen, mit ihm weichen freie Karten immer aus.
  oracle: { cx: 576, size: [ 96, 160 ], rest: 90, out: [ 60, 30 ], opening: 36, notch: [ 33, 63, 13 ],
    band: [ 4.5, 6, 72.5, 19 ], word: 13, maxScale: 1.9 }
  # Laterne (Schritt 5n, ARCHITEKTUR.md 11.9): Mitte relativ zur Tischmitte, Kantenlänge, Lage der Flamme im Bild
  # (Anteil, public/assets/table/laterne.webp), Höhe der Flamme über dem Tisch (Länge der Schatten)
  lamp: { at: [ 120, 354 ], size: 128, flame: [ 0.5024, 0.4561 ], height: 260 }
# Bögen (Schritt 5q, ARCHITEKTUR.md 10.3): ein Abstand ab der sichtbaren Kante des Lederrands, zur Tischkante, zum Filz und
# zwischen zwei Bögen. Jede Gruppe von Bögen so groß, wie sie mit diesem Abstand neben den Filz passt (Gruppe = Bögen
# mit einem Maßstab: in der Draufsicht beide Spalten zusammen, in der Rollenansicht jede Spalte für sich). Der Rest liegt
# quer zum Filz links und rechts gleich, in der Höhe oben und unten gleich; Ausnahme: die anderen Bögen der
# Rollenansicht liegen oben bündig an der Reserve (role.sheets.others.top).
sheets: { spacing: 24 }
overview:
  middle: [ 530, 10 ]
  # Licht der Laterne je Ansicht: Reichweite in TP, Grundlicht am Rand (0 = schwarz, 1 = ungedämpft)
  light: { reach: 1050, ambient: 0.3 }
  sheets: { columns: [ [ seat1, seat3 ], [ seat2, seat4 ] ] }
role:
  middle: [ 710, 10 ]
  # weiter und heller als in der Draufsicht: der eigene Bogen liegt links unten weit von der Laterne
  light: { reach: 1500, ambient: 0.45 }
  sheets:
    # eigener Bogen links neben der Tischmitte; Spalte rechts: andere Bögen untereinander, oben bündig unter der
    # Reserve für den Menüknopf (top, ab der Tischkante)
    others: { top: 70, opacity: 0.88 }
